[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stackgate"
version = "0.1.0"
description = "Statistically rigorous, function-level performance-regression detection from sampling profiles."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Samarth Agrawal", email = "agrawalsamarth0206@gmail.com" }
]
maintainers = [
    { name = "Samarth Agrawal", email = "agrawalsamarth0206@gmail.com" }
]
keywords = [
    "profiling",
    "performance",
    "regression",
    "flamegraph",
    "sampling-profiler",
    "tachyon",
    "py-spy",
    "ci-gate",
    "continuous-integration",
    "statistics",
    "benjamini-hochberg"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "build",
    "twine",
    "scipy>=1.10",
    "numpy>=1.20",
]

[project.scripts]
stackgate = "stackgate.cli:main"

[project.entry-points.pytest11]
stackgate = "stackgate.pytest_plugin"

[project.urls]
Homepage = "https://github.com/samarthagrawal/stackgate"
Documentation = "https://github.com/samarthagrawal/stackgate#readme"
Repository = "https://github.com/samarthagrawal/stackgate.git"
Issues = "https://github.com/samarthagrawal/stackgate/issues"
Changelog = "https://github.com/samarthagrawal/stackgate/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v"
pythonpath = ["src"]
